# One-command setup: `docker compose up`
#   ollama   serves GPT-OSS-20B locally (no paid API, no key)
#   models   pulls gpt-oss:20b once, then exits
#   searxng  self-hosted search for the research agents (free, no key)
#   app      the venture builder; open it with `docker compose exec app python -m venture_builder.cli`
# The repo is mounted into the app, so outputs/ and decision_log.json land in the repo.
# Gemma 4 31B is called through Google's Gemini API: set GEMINI_API_KEY in .env (free tier).
# Without a key every role runs on GPT-OSS-20B.
# To use an Ollama already running on this machine: OLLAMA_HOST=http://host.docker.internal:11434 and SKIP_MODEL_PULL=1.

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60

  models:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_OSS: ${MODEL_OSS:-gpt-oss:20b}
      SKIP_MODEL_PULL: ${SKIP_MODEL_PULL:-0}
    entrypoint: ["/bin/sh", "-c", "[ \"$$SKIP_MODEL_PULL\" = 1 ] && exit 0; ollama pull \"$$MODEL_OSS\""]
    restart: "no"

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-placeholder}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro

  app:
    build: .
    depends_on:
      models:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      SEARXNG_URL: http://searxng:8080
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets OLLAMA_HOST reach an Ollama on this machine
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"   # web UI
    stdin_open: true
    tty: true

volumes:
  ollama:
