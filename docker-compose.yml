# One-command setup: `docker compose up`
#   ollama  serves the open-weight model locally (no paid API, no key)
#   model   pulls the model once, then exits
#   app     the six-phase pipeline (workflow.py)
# The repo is mounted into the app, so outputs/ and decision_log.json land in the repo.

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60

  model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3:8b}"]
    restart: "no"

  app:
    build: .
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
    env_file:
      - path: .env
        required: false
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    stdin_open: true
    tty: true

volumes:
  ollama:
