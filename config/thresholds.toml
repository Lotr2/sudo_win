# Gate thresholds, fixed before any evidence exists. Gate 2 targets are locked and hashed per run.

[limits]
max_repeats_per_phase = 2
debate_rounds = 2          # Phase 2 canvas revisions
build_loops = 3            # Phase 3 build-test loops
memo_revisions = 2         # Phase 6 critic revisions
max_blocking_questions = 3

[gate1]
min_pain_signals = 3
min_source_domains = 2
min_score = 0.6

[gate2]
go_ratio = 1.0             # result >= 100% of the locked target
repeat_ratio = 0.5         # 50-99% -> repeat (once); below 50% -> stop or pivot

[gate2.floors]
# Lowest targets the Experiment Designer may propose. The founder may go below a floor;
# that is allowed but logged as an override against the recommendation.
waitlist_signups = 30        # waitlist experiments: at least 30 sign-ups
visitor_signup_rate = 0.05   # conversion experiments: at least 5% of visitors sign up
max_window_days = 30         # a target cannot be spread over more than 30 days

[demo]
question_timeout_seconds = 30
max_intake_questions = 3
max_blocking_questions_per_phase = 1
max_sources_per_variant = 5

[gate6]
# Locked and hashed at the start of Phase 6, before any (MOCKED) event is entered.
min_conversion = 0.02      # orders / store visitors
max_refund_rate = 0.10     # refunds / orders
