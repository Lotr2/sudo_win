# Gate thresholds, fixed before any evidence exists. Gate 2 targets are locked and hashed per run.

[limits]
max_repeats_per_phase = 2  # default when a gate has no max_repeats of its own
debate_rounds = 2          # Phase 2 canvas revisions
build_loops = 3            # Phase 3 build-test loops
memo_revisions = 2         # Phase 6 critic revisions
max_blocking_questions = 3

[gate1]
max_repeats = 2            # extra research rounds before a weak idea becomes STOP
min_pain_signals = 3
min_source_domains = 2
min_score = 0.6

[gate2]
max_repeats = 1            # a near miss (50-99%) is re-tested once, then pivot or stop
go_ratio = 1.0             # result >= 100% of the locked target
repeat_ratio = 0.5         # 50-99% -> repeat (once); below 50% -> stop or pivot

[gate3]
max_repeats = 1            # one retry with a smaller spec, then stop

[gate2.floors]
# Lowest targets the Experiment Designer may propose. The founder may go below a floor;
# that is allowed but logged as an override against the recommendation.
waitlist_signups = 30        # waitlist experiments: at least 30 sign-ups
visitor_signup_rate = 0.05   # conversion experiments: at least 5% of visitors sign up
max_window_days = 30         # a target cannot be spread over more than 30 days

[demo]
question_timeout_seconds = 30
max_intake_questions = 3
max_blocking_questions_per_phase = 1
max_sources_per_variant = 5
node_budget_seconds = 240  # time budget per step in demo mode

[gate6]
# Locked and hashed at the start of Phase 6, before any (MOCKED) event is entered.
min_conversion = 0.02      # orders / store visitors
max_refund_rate = 0.10     # refunds / orders

[skills]
# Agentic skills: settings for each (smaller values apply in demo mode, the *_demo keys).
research_rounds = 3          # search -> read -> reflect -> refine, per version and researcher; stops early once the bar is met
research_rounds_demo = 2
extraction_votes = 3         # independent readings of the evidence; a finding counts only if most of them agree
extraction_votes_demo = 2
fetch_pages = 3              # pages read in full per query (the rest are search snippets)
fetch_pages_demo = 2
scout_candidates = 10        # versions of the idea generated before the shortlist
scout_candidates_demo = 6
scout_shortlist = 4          # versions kept for full research
scout_shortlist_demo = 3
grounding_check = true       # fact-check founder-facing explanations against the facts before showing them
builder_self_review = true   # review the product against a rubric once and revise if it falls short
review_pass_score = 4        # 1-5
