[project]
name = "venture-builder"
version = "0.1.0"
description = "An open-source team of AI agents that takes a founder's brief toward a validated, sellable digital product."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.3",
    "pydantic==2.14.2",
    "httpx==0.28.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.scripts]
venture = "venture_builder.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["venture_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a reachable Ollama and/or the Gemini API (skipped by default)"]
addopts = "-m 'not live'"
