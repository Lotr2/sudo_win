# Single-PC mode, one command: docker compose up  ->  open http://localhost:8501
#   llm  llama.cpp server on this PC's GPU (downloads gpt-oss-20b MXFP4 GGUF once, ~12 GB)
#   app  founder UI; each run starts the orchestrator as its own process
# Needs one NVIDIA GPU with 16 GB VRAM and the NVIDIA Container Toolkit.
# Two GPU PCs + a CPU-only orchestrator machine: see deploy/gpu-node and deploy/orchestrator.
services:
  llm:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    command: >-
      -hf ${LLM_HF_REPO:-ggml-org/gpt-oss-20b-GGUF} --alias ${LLM_MODEL:-gpt-oss-20b}
      --jinja -ngl 99 -c ${LLM_CTX:-32768} -np ${LLM_SLOTS:-4} --host 0.0.0.0 --port 8080
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - llm-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 360          # first start downloads the model
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LLM_ENDPOINTS=local=http://llm:8080/v1
      - LLM_SLOTS=${LLM_SLOTS:-4}
      - ARCH_VARIANT=${ARCH_VARIANT:-_template}
    volumes:
      - ./runs:/app/runs
    depends_on:
      llm:
        condition: service_healthy

volumes:
  llm-models:
