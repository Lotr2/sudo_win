# Smoke tests on every push and pull request. They run on a fake model client, so no model, key or network
# service is needed (tests marked `live` are skipped by default; see pyproject.toml).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (as the Dockerfile does)
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .
          pip install pytest==9.2.0
      - name: Smoke tests
        run: python -m pytest -q
      - name: Evals harness on the fake models
        run: python evals/run_evals.py --fake
      - name: Docker Compose file is valid
        run: docker compose config --quiet
