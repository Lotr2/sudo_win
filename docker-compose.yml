# One-command setup: `docker compose up`, then open http://localhost:8000
#   ollama      serves GPT-OSS-20B locally (no paid API, no key)
#   model-init  pulls gpt-oss:20b once if it is missing, then exits
#   searxng     self-hosted search for the research agents (free, no key)
#   app         web UI + API (and the `venture` CLI: docker compose exec app venture --help)
# Gemma 4 31B is called through Google's Gemini API: put GEMINI_API_KEY in .env (free tier).
# Without a key every role runs on GPT-OSS-20B (single-model mode, shown in the UI).
# Ollama on another machine: docker compose -f docker-compose.yml -f compose.remote-ollama.yaml up
# GPT-OSS-20B already served by llama.cpp on this machine: docker compose -f docker-compose.yml -f compose.llamacpp.yaml up

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60

  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_OSS: ${MODEL_OSS:-gpt-oss:20b}
    entrypoint: ["/bin/sh", "-c", "ollama show \"$$MODEL_OSS\" >/dev/null 2>&1 || ollama pull \"$$MODEL_OSS\""]
    restart: "no"

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-placeholder}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro

  app:
    build: .
    depends_on:
      model-init:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed here so a local .env made for running without Docker cannot point the container elsewhere.
      OSS_BACKEND: ollama
      OLLAMA_HOST: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
      RUNS_DIR: /app/runs
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - runs:/app/runs
      - ./outputs:/app/outputs
      - ./decision_log.json:/app/decision_log.json
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true

volumes:
  ollama:
  runs:
